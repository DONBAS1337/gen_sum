name: DON-GEN standalone mod checks
on:
  workflow_dispatch:
  push:
    branches: [feature/camp-sandbox-rpg]
  pull_request:
    paths:
      - "don_gen/**"
      - "tests/**"
      - "install.ps1"
      - ".github/workflows/rpg-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse installer and smoke-test paths with spaces, private assets, backup, repeat install
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location) "install.ps1"), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            throw "install.ps1 contains PowerShell parser errors"
          }
          $root = Join-Path $env:RUNNER_TEMP "DON-GEN installer smoke"
          $game = Join-Path $root "Everlasting Summer"
          $assets = Join-Path $root "Local Private Assets"
          $workshop = Join-Path $root "Workshop CE Resources"
          New-Item -ItemType Directory -Force -Path (Join-Path $game "game") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $assets "maps") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $assets "cg") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $workshop "scenario_alt/Pics") | Out-Null
          Set-Content -LiteralPath (Join-Path $game "game/archive.rpa") -Value "test"
          Set-Content -LiteralPath (Join-Path $assets "maps/map_bg.jpg") -Value "mock image"
          Set-Content -LiteralPath (Join-Path $assets "maps/map_avaliable.jpg") -Value "mock hover"
          Set-Content -LiteralPath (Join-Path $assets "maps/map_selected.jpg") -Value "mock selected"
          Set-Content -LiteralPath (Join-Path $assets "maps/map_icon_mi.png") -Value "mock icon"
          Set-Content -LiteralPath (Join-Path $assets "cg/example.png") -Value "mock CG"
          $hash = "0123456789abcdef0123456789abcdef01234567"
          '{"' + $hash + '":"mods/don_gen/images/gen_assets/cg/example.png"}' |
            Set-Content -LiteralPath (Join-Path $assets "cg_index.json")
          & ./install.ps1 -GameDir $game -AssetsDir $assets -WorkshopDir $workshop
          $mod = Join-Path $game "game/mods/don_gen"
          if (-not (Test-Path -LiteralPath (Join-Path $mod "dg_rpg.rpy"))) { throw "Mod not installed" }
          $sources = Get-Content -LiteralPath (Join-Path $mod "resource_sources.json") -Raw | ConvertFrom-Json
          if ($sources.seven_dl_root -ne $workshop) { throw "Workshop resource path not saved" }
          if (-not (Test-Path -LiteralPath (Join-Path $mod "images/gen_assets/map_bg.jpg"))) { throw "Missing imported classic map" }
          if (-not (Test-Path -LiteralPath (Join-Path $mod "images/gen_assets/map_icon_mi.png"))) { throw "Missing imported icon" }
          if (-not (Test-Path -LiteralPath (Join-Path $mod "images/gen_assets/cg/example.png"))) { throw "Missing imported curated CG" }
          Set-Content -LiteralPath (Join-Path $mod "comfy_workflow_background_api.json") -Value '{"test":true}'
          Set-Content -LiteralPath (Join-Path $mod "dg_old.rpyc") -Value "stale bytecode"
          & ./install.ps1 -GameDir $game -AssetsDir $assets
          if (-not (Test-Path -LiteralPath (Join-Path $mod "comfy_workflow_background_api.json"))) { throw "User workflow was deleted" }
          if (Test-Path -LiteralPath (Join-Path $mod "dg_old.rpyc")) { throw "Stale compiled script retained" }
          if (-not (Get-ChildItem -LiteralPath (Join-Path $game "DON-GEN-backups") -Directory)) {
            # Backups live at the Everlasting Summer root, not inside game.
            throw "Missing backup"
          }
          Write-Host "PowerShell parser / private asset installer smoke checks OK"
      - name: Compile all standalone Python modules
        run: python -m compileall -q don_gen
      - name: Verify code is readable by Python 2.7 grammar (Ren'Py 7.x)
        run: |
          python -W ignore::DeprecationWarning - <<'PY'
          from pathlib import Path
          from lib2to3.refactor import RefactoringTool
          parser = RefactoringTool([])
          for path in Path("don_gen").glob("*.py"):
              parser.refactor_string(path.read_text(encoding="utf-8") + "\n", str(path))
              print("Py2 grammar OK:", path)
          PY
      - name: Test DON-GEN core and standalone layout
        run: python -m unittest discover -s tests -p 'test_don_gen*.py' -v
      - name: Verify no legacy imports in standalone package
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in Path("don_gen").glob("*"):
              if path.suffix not in (".py", ".rpy"):
                  continue
              content = path.read_text(encoding="utf-8")
              for forbidden in (r"\bgs_", r"\bGS_", "mods/generative_summer", "ready_replace"):
                  assert not re.search(forbidden, content), (path, forbidden)
          print("Standalone namespace / dependencies: OK")
          PY

