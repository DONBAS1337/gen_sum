name: DON-GEN standalone mod checks
on:
  workflow_dispatch:
  push:
    branches: [feature/camp-sandbox-rpg]
  pull_request:
    paths:
      - "don_gen/**"
      - "tests/**"
      - "install.ps1"
      - ".github/workflows/rpg-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all standalone Python modules
        run: python -m compileall -q don_gen
      - name: Verify code is readable by Python 2.7 grammar (Ren'Py 7.x)
        run: |
          python -W ignore::DeprecationWarning - <<'PY'
          from pathlib import Path
          from lib2to3.refactor import RefactoringTool
          parser = RefactoringTool([])
          for path in Path("don_gen").glob("*.py"):
              parser.refactor_string(path.read_text(encoding="utf-8") + "\n", str(path))
              print("Py2 grammar OK:", path)
          PY
      - name: Test DON-GEN core and standalone layout
        run: python -m unittest discover -s tests -p 'test_don_gen*.py' -v
      - name: Verify no legacy imports in standalone package
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in Path("don_gen").glob("*"):
              if path.suffix not in (".py", ".rpy"):
                  continue
              content = path.read_text(encoding="utf-8")
              for forbidden in (r"\bgs_", r"\bGS_", "mods/generative_summer", "ready_replace"):
                  assert not re.search(forbidden, content), (path, forbidden)
          print("Standalone namespace / dependencies: OK")
          PY
